{% extends "base.html" %}
{% block title %}Sign in · BudgetBetter{% endblock %}
{% block pagetitle %}Sign in{% endblock %}

{% block content %}
<div class="card raised auth">
  <div class="card-head"><h2>Household</h2></div>
  <div class="pad">
    {% if error %}<div class="notice err">{{ error }}</div>{% endif %}
    <form method="post" action="/household/login">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autofocus autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn-primary" type="submit">Sign in</button>
    </form>
    <hr class="rule-dashed">
    <p class="sub" style="margin:0">
      New here? <a href="/household/register">Register with the House PIN</a>.
    </p>
  </div>
</div>
{% endblock %}
