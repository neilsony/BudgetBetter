<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BudgetBetter{% endblock %}</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #fbfbfc;
    --border: #e4e6ea;
    --text: #14161a;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --positive: #059669;
    --negative: #dc2626;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16,18,22,.05), 0 8px 24px rgba(16,18,22,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f13;
      --surface: #16191f;
      --surface-2: #1b1f26;
      --border: #262b34;
      --text: #e8eaed;
      --muted: #9aa1ac;
      --accent: #818cf8;
      --accent-soft: #1e2130;
      --positive: #34d399;
      --negative: #f87171;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 64px; }

  header.top {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    margin-bottom: 26px;
  }
  .brand { font-size: 20px; font-weight: 650; letter-spacing: -.02em; }
  .brand span { color: var(--accent); }
  .spacer { flex: 1; }
  .meta { color: var(--muted); font-size: 13px; text-align: right; line-height: 1.35; }
  .pill {
    display: inline-block; padding: 3px 9px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase;
  }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .card + .card { margin-top: 20px; }
  .card-head {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .card-head h2 { margin: 0; font-size: 15px; font-weight: 620; letter-spacing: -.01em; }

  button, .btn {
    font: inherit; font-weight: 550; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    padding: 8px 14px; border-radius: 9px; text-decoration: none; display: inline-block;
    transition: background .12s ease, border-color .12s ease, transform .06s ease;
  }
  button:hover, .btn:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
  .btn-danger { background: var(--negative); border-color: var(--negative); color: #fff; }
  .btn-ghost { background: transparent; }

  .segmented { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 2px; }
  .segmented a {
    padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 550;
    text-decoration: none; color: var(--muted);
  }
  .segmented a.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  .notice {
    padding: 12px 16px; border-radius: 10px; margin-bottom: 20px;
    background: var(--accent-soft); border: 1px solid var(--border); font-size: 14px;
  }
  .empty { padding: 44px 20px; text-align: center; color: var(--muted); }
  code {
    font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 2px 6px; border-radius: 6px;
  }
  pre code { display: block; padding: 14px 16px; overflow-x: auto; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Budget<span>Better</span></div>
    {% if is_sandbox is defined and is_sandbox %}<span class="pill">Sandbox</span>{% endif %}
    <div class="spacer"></div>
    {% block headerextra %}{% endblock %}
  </header>
  {% block content %}{% endblock %}
</div>
</body>
</html>
